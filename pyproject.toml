[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cityvision"
version = "0.1.0"
description = "GBSoft City Vision — municipal video AI pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "opencv-python-headless>=4.9.0",
  "numpy>=1.26.0",
  "PyYAML>=6.0.1",
  "ultralytics>=8.3.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "tqdm>=4.66.0",
  "huggingface_hub>=0.24.0",
  "psycopg[binary]>=3.2.0",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "boto3>=1.34.0",
  "redis>=5.0.0",
  "PyJWT>=2.8.0",
]

[project.scripts]
cityvision = "cityvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
