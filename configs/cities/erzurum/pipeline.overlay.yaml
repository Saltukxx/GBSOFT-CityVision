# Optional per-city overrides merged onto configs/pipeline.yaml at runtime
run:
  vehicle_id: DJI-ERZ-01
events:
  fusion_radius_m: 15
  # City survey: re-enable waste with high bar (no dashcam ROI — aerial default)
  event_classes:
    - pothole
    - road_crack
    - road_damage
    - overflowing_container
    - street_waste
  min_observations: 2
  class_min_confidence:
    pothole: 0.72
    overflowing_container: 0.92
    street_waste: 0.92
  road_roi:
    enabled: false
